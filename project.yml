name: Parcel
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Parcel:
    type: application
    platform: iOS
    sources:
      - path: Parcel
    info:
      path: Parcel/Info.plist
      properties:
        CFBundleDisplayName: Parcel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Parcel connects to the Sonarr, Radarr and download servers on your network.
        # Home servers are usually plain http on a LAN, so ATS is relaxed.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.parcel
        TARGETED_DEVICE_FAMILY: "1,2"
